<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open DApp in Binance</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: #16161a;
            border-radius: 16px;
            padding: 40px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        h1 { font-size: 1.5rem; margin-bottom: 8px; color: #f0b90b; text-align: center; }
        .subtitle { color: #888; text-align: center; margin-bottom: 24px; font-size: 0.9rem; }
        #qr-box {
            background: #fff;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 280px;
            margin: 16px 0;
        }
        .url-display {
            text-align: center; font-size: 0.7rem; color: #555;
            word-break: break-all; margin-top: 8px;
        }
        .info {
            margin-top: 16px; padding: 12px; background: #1e1e1e;
            border-radius: 8px; font-size: 0.8rem; color: #888;
        }
        .info p { margin: 4px 0; }
        .info strong { color: #f0b90b; }
        .toggle { margin-top: 16px; text-align: center; }
        .toggle button {
            padding: 10px 20px; border: none; border-radius: 8px;
            font-size: 0.9rem; font-weight: 600; cursor: pointer;
            margin: 4px; transition: opacity 0.2s;
        }
        .toggle button:hover { opacity: 0.85; }
        .toggle .active { background: #f0b90b; color: #000; }
        .toggle .inactive { background: #333; color: #888; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Binance Web3 Wallet</h1>
        <p class="subtitle" id="mode-label">Scan QR to Open DApp</p>

        <div id="qr-box"></div>
        <div class="url-display" id="url-display"></div>

        <div class="toggle">
            <button id="btn-url" class="active">URL QR</button>
            <button id="btn-wc" class="inactive">WalletConnect QR</button>
        </div>

        <div class="info">
            <p><strong>URL QR:</strong> Binance opens dApp in its browser</p>
            <p><strong>WalletConnect:</strong> Connect wallet via protocol</p>
            <p>&nbsp;</p>
            <p>1. Open Binance App</p>
            <p>2. Web3 Wallet tab</p>
            <p>3. Tap scan icon (top right)</p>
            <p>4. Scan the QR code</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>

    <script>
        const DAPP_URL = 'https://type-usdt-amount.vercel.app/';
        const PROJECT_ID = '4689db3295784d6a806b30b4975c8faa';
        const qrBox = document.getElementById('qr-box');
        const urlDisplay = document.getElementById('url-display');
        const modeLabel = document.getElementById('mode-label');
        const btnUrl = document.getElementById('btn-url');
        const btnWc = document.getElementById('btn-wc');

        function renderQR(value) {
            qrBox.innerHTML = '';
            const canvas = document.createElement('canvas');
            qrBox.appendChild(canvas);
            new QRious({ element: canvas, value: value, size: 320, level: 'H' });
            urlDisplay.textContent = value.substring(0, 60) + '...';
        }

        // Mode 1: URL QR — Binance opens dApp in its browser
        function showUrlQR() {
            modeLabel.textContent = 'Scan QR to Open DApp in Binance';
            btnUrl.className = 'active';
            btnWc.className = 'inactive';
            renderQR(DAPP_URL);
        }

        // Mode 2: WalletConnect QR
        let wcProvider = null;
        async function showWcQR() {
            modeLabel.textContent = 'Scan QR to Connect via WalletConnect';
            btnUrl.className = 'inactive';
            btnWc.className = 'active';

            try {
                const mod = await import('https://cdn.jsdelivr.net/npm/@walletconnect/ethereum-provider@2.11.2/+esm');
                const EthereumProvider = mod.EthereumProvider || mod.default;

                wcProvider = await EthereumProvider.init({
                    projectId: PROJECT_ID,
                    chains: [56],
                    optionalChains: [1, 137, 42161],
                    showQrModal: false,
                    metadata: {
                        name: 'Sandbox',
                        description: 'Test',
                        url: window.location.origin,
                        icons: []
                    }
                });

                wcProvider.on('display_uri', (uri) => {
                    renderQR(uri);
                });

                wcProvider.on('connect', (accounts) => {
                    const addr = accounts?.accounts?.[0] || accounts?.[0] || '';
                    qrBox.innerHTML = '';
                    urlDisplay.innerHTML = '✅ Connected: <strong>' + addr + '</strong>';
                });

                await wcProvider.enable();
            } catch (error) {
                console.error(error);
                urlDisplay.textContent = 'Error: ' + error.message;
            }
        }

        btnUrl.onclick = showUrlQR;
        btnWc.onclick = showWcQR;

        // Start with URL QR
        showUrlQR();
    </script>
</body>
</html>
