<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binance Web3 Wallet - Connect</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: #16161a;
            border-radius: 16px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        h1 { font-size: 1.5rem; margin-bottom: 8px; color: #f0b90b; text-align: center; }
        .subtitle { color: #888; text-align: center; margin-bottom: 24px; font-size: 0.9rem; }
        #qrcode { display: flex; justify-content: center; margin: 20px 0; min-height: 220px; }
        #qrcode canvas { border-radius: 8px; background: #fff; padding: 10px; }
        .status {
            text-align: center; padding: 16px;
            background: #1e1e1e; border-radius: 8px; margin-top: 16px; font-size: 0.9rem;
            word-break: break-word;
        }
        .status.connected { background: #0a3d0a; border: 1px solid #2ecc71; }
        .status.error { background: #3d0a0a; border: 1px solid #e74c3c; }
        .address { font-family: monospace; word-break: break-all; color: #f0b90b; margin-top: 8px; font-size: 0.8rem; }
        .info {
            margin-top: 20px; padding: 12px; background: #1e1e1e;
            border-radius: 8px; font-size: 0.8rem; color: #888;
        }
        .info p { margin: 4px 0; }
        .info strong { color: #f0b90b; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Binance Web3 Wallet</h1>
        <p class="subtitle">Scan QR to Connect</p>

        <div id="qrcode">
            <p style="color: #666; padding: 40px;">Loading...</p>
        </div>

        <div id="status" class="status">Initializing...</div>

        <div class="info">
            <p><strong>Steps:</strong></p>
            <p>1. Open Binance App on phone</p>
            <p>2. Go to Web3 Wallet tab</p>
            <p>3. Tap scan icon (top right)</p>
            <p>4. Scan the QR code</p>
            <p>5. Approve connection in Binance</p>
        </div>
    </div>

    <script type="module">
        const statusDiv = document.getElementById('status');
        const qrcodeDiv = document.getElementById('qrcode');

        try {
            statusDiv.textContent = 'Loading WalletConnect...';

            const { EthereumProvider } = await import('https://esm.sh/@walletconnect/ethereum-provider@2.11.2');
            const QRCode = (await import('https://esm.sh/qrcode@1.5.3')).default;

            statusDiv.textContent = 'Creating connection...';

            const provider = await EthereumProvider.init({
                projectId: '5a3aa5a125ad0c7769810cf1d0a70084',
                chains: [56],
                optionalChains: [1, 137, 42161],
                showQrModal: false,
                metadata: {
                    name: 'Sandbox Test',
                    description: 'QR Connection Test',
                    url: window.location.origin,
                    icons: []
                }
            });

            // Listen for URI event BEFORE enabling
            provider.on('display_uri', async (uri) => {
                statusDiv.textContent = 'Generating QR code...';
                const canvas = await QRCode.toCanvas(uri, {
                    width: 200,
                    margin: 2,
                    errorCorrectionLevel: 'M'
                });
                qrcodeDiv.innerHTML = '';
                qrcodeDiv.appendChild(canvas);
                statusDiv.textContent = 'Scan with Binance Web3 Wallet';
            });

            provider.on('connect', (accounts) => {
                const addr = accounts?.accounts?.[0] || accounts?.[0] || 'Connected';
                statusDiv.innerHTML = '✅ Connected!<br><div class="address">' + addr + '</div>';
                statusDiv.className = 'status connected';
            });

            provider.on('disconnect', () => {
                statusDiv.textContent = 'Disconnected. Refresh to reconnect.';
                statusDiv.className = 'status';
            });

            statusDiv.textContent = 'Starting connection...';
            await provider.enable();

        } catch (error) {
            statusDiv.textContent = 'Error: ' + error.message;
            statusDiv.className = 'status error';
            console.error(error);
        }
    </script>
</body>
</html>
