<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binance Web3 Wallet - Connect</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: #16161a;
            border-radius: 16px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        h1 { font-size: 1.5rem; margin-bottom: 8px; color: #f0b90b; text-align: center; }
        .subtitle { color: #888; text-align: center; margin-bottom: 24px; font-size: 0.9rem; }
        #status {
            text-align: center; padding: 16px;
            background: #1e1e1e; border-radius: 8px; margin: 16px 0; font-size: 0.9rem;
            word-break: break-word;
        }
        #status.error { background: #3d0a0a; border: 1px solid #e74c3c; }
        #status.connected { background: #0a3d0a; border: 1px solid #2ecc71; }
        .info {
            margin-top: 20px; padding: 12px; background: #1e1e1e;
            border-radius: 8px; font-size: 0.8rem; color: #888;
        }
        .info p { margin: 4px 0; }
        .info strong { color: #f0b90b; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Binance Web3 Wallet</h1>
        <p class="subtitle">Scan QR to Connect</p>

        <div id="status">Loading...</div>
        <div id="qrcode" style="display:flex;justify-content:center;margin:16px 0;min-height:220px;"></div>

        <div class="info">
            <p><strong>Steps:</strong></p>
            <p>1. Open Binance App on phone</p>
            <p>2. Go to Web3 Wallet tab</p>
            <p>3. Tap scan icon (top right)</p>
            <p>4. Scan the QR code</p>
            <p>5. Approve connection in Binance</p>
        </div>
    </div>

    <!-- Load all dependencies from jsdelivr (reliable CDN) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script>
        const statusDiv = document.getElementById('status');
        const PROJECT_ID = '4689db3295784d6a806b30b4975c8faa';

        function setStatus(text, cls) {
            statusDiv.textContent = text;
            statusDiv.className = cls || '';
        }

        async function connect() {
            try {
                setStatus('Loading libraries...');

                // Load EthereumProvider from jsdelivr
                const mod = await import('https://cdn.jsdelivr.net/npm/@walletconnect/ethereum-provider@2.11.2/+esm');
                const EthereumProvider = mod.EthereumProvider || mod.default;

                setStatus('Initializing...');

                const provider = await EthereumProvider.init({
                    projectId: PROJECT_ID,
                    chains: [56],
                    optionalChains: [1, 137, 42161],
                    showQrModal: false,
                    metadata: {
                        name: 'Sandbox',
                        description: 'Test',
                        url: window.location.origin,
                        icons: []
                    }
                });

                setStatus('Waiting for QR...');

                provider.on('display_uri', (uri) => {
                    console.log('URI received:', uri);
                    setStatus('Scan this QR with Binance Web3 Wallet');
                    const el = document.getElementById('qrcode');
                    el.innerHTML = '';
                    if (window.QRCode) {
                        new QRCode(el, {
                            text: uri,
                            width: 220,
                            height: 220,
                            colorDark: '#000000',
                            colorLight: '#ffffff',
                            correctLevel: QRCode.CorrectLevel.M
                        });
                    }
                });

                provider.on('connect', (accounts) => {
                    const addr = accounts?.accounts?.[0] || accounts?.[0] || 'Connected';
                    setStatus('✅ Connected! ' + addr, 'connected');
                });

                setStatus('Connecting...');
                await provider.enable();

            } catch (error) {
                console.error(error);
                setStatus('Error: ' + error.message, 'error');
            }
        }

        connect();
    </script>
</body>
</html>
