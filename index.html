<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binance Web3 Wallet - Connect</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: #16161a;
            border-radius: 16px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        h1 { font-size: 1.5rem; margin-bottom: 8px; color: #f0b90b; text-align: center; }
        .subtitle { color: #888; text-align: center; margin-bottom: 24px; font-size: 0.9rem; }
        #status {
            text-align: center; padding: 16px;
            background: #1e1e1e; border-radius: 8px; margin: 16px 0; font-size: 0.9rem;
        }
        .info {
            margin-top: 20px; padding: 12px; background: #1e1e1e;
            border-radius: 8px; font-size: 0.8rem; color: #888;
        }
        .info p { margin: 4px 0; }
        .info strong { color: #f0b90b; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Binance Web3 Wallet</h1>
        <p class="subtitle">Scan QR to Connect</p>

        <div id="status">Loading Web3Modal...</div>

        <div class="info">
            <p><strong>Steps:</strong></p>
            <p>1. Open Binance App on phone</p>
            <p>2. Go to Web3 Wallet tab</p>
            <p>3. Tap scan icon (top right)</p>
            <p>4. Scan the QR code</p>
            <p>5. Approve connection in Binance</p>
        </div>
    </div>

    <script type="module">
        const statusDiv = document.getElementById('status');

        try {
            const { Web3Modal } = await import('https://esm.sh/@web3modal/standalone@3.5.7');
            const { EthereumProvider } = await import('https://esm.sh/@walletconnect/ethereum-provider@2.11.2');

            statusDiv.textContent = 'Creating WalletConnect...';

            const provider = await EthereumProvider.init({
                projectId: '4689db3295784d6a806b30b4975c8faa',
                chains: [56],
                optionalChains: [1, 137, 42161],
                showQrModal: false,
                metadata: {
                    name: 'Sandbox',
                    description: 'Test',
                    url: window.location.origin,
                    icons: []
                }
            });

            const modal = new Web3Modal({
                projectId: '4689db3295784d6a806b30b4975c8faa',
                standalone: true
            });

            statusDiv.textContent = 'Open the QR modal...';

            provider.on('display_uri', (uri) => {
                statusDiv.textContent = 'QR ready — scan with Binance';
                modal.open({ uri });
            });

            provider.on('connect', (accounts) => {
                const addr = accounts?.accounts?.[0] || accounts?.[0] || 'Connected';
                statusDiv.innerHTML = '✅ Connected!<br><span style="font-family:monospace;color:#f0b90b;font-size:0.8rem;word-break:break-all;">' + addr + '</span>';
                modal.close();
            });

            await provider.enable();

        } catch (error) {
            statusDiv.innerHTML = '<span style="color:#e74c3c">Error: ' + error.message + '</span>';
            console.error(error);
        }
    </script>
</body>
</html>
